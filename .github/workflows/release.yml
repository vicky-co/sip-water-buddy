name: Release

# Push a tag like v2.1.0 to build the Windows installer, the portable Windows exe, the Windows folder zip and the Linux zip, then publish a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  linux:
    name: Linux zip
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tag must match package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm run lint
      - run: npm test
      - run: npm run package:linux
      - name: Windows folder zip (run without installing)
        run: npm run package:win-zip
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*.zip
          if-no-files-found: error

  windows:
    name: Windows installer and portable exe
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package:win
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/installer/*.exe
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - name: Checksums
        run: cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --title "Sip $GITHUB_REF_NAME" --generate-notes
