name: Release

# Push a tag like v2.1.0 to build the Windows installer, the portable Windows exe, the Windows folder zip and the Linux zip, then publish a GitHub release.
# It can also be started by hand (Actions > Release > Run workflow) on main: it then releases the version in package.json and creates the tag itself.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux zip
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tag must match package.json
        if: github.ref_type == 'tag'
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm run lint
      - run: npm test
      - run: npm run package:linux
      - name: Windows folder zip (run without installing)
        run: npm run package:win-zip
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*.zip
          if-no-files-found: error

  windows:
    name: Windows installer and portable exe
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package:win
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/installer/*.exe
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [linux, windows]
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - name: Checksums
        run: cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$GITHUB_REF_NAME"
          if [ "$GITHUB_REF_TYPE" != tag ]; then TAG="v$(jq -r .version package.json)"; fi
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Sip $TAG" --generate-notes
